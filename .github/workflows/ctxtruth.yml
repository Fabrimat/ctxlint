name: ctxtruth

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ctxtruth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./
        with:
          command: node dist/cli.js
          sarif: 'true'
